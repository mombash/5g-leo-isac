[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-ofdm-reproducible-package"
version = "0.2.1"
description = "5G NR LEO passive sensing simulator and receiver"
requires-python = ">=3.10"
dependencies = ["numpy==2.1.3", "scipy==1.15.3"]

[project.scripts]
leo-ofdm = "leo_ofdm_repro.cli:main"

[project.optional-dependencies]
gpu = ["torch==2.6.0+cu124", "triton==3.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
include = ["leo_ofdm_repro", "leo_ofdm_repro.*"]

[tool.setuptools.package-data]
leo_ofdm_repro = ["_config/*.json", "_config/*.json.gz", "NOTICES.md", "matlab/**/*.m", "native/*.cpp"]
