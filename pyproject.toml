[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "5g-leo-isac"
version = "0.3.0"
description = "5G NR LEO passive sensing simulator and receiver"
requires-python = ">=3.10"
dependencies = ["numpy==2.1.3", "scipy==1.15.3"]

[project.scripts]
5g-leo-isac = "fiveg_leo_isac.cli:main"

[project.optional-dependencies]
gpu = ["torch==2.6.0+cu124", "triton==3.2.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
include = ["fiveg_leo_isac", "fiveg_leo_isac.*"]

[tool.setuptools.package-data]
fiveg_leo_isac = ["_config/*.json", "_config/*.json.gz", "NOTICES.md", "matlab/**/*.m", "native/*.cpp"]
